[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-24g-monitor"
version = "1.0.0"
description = "Universal battery telemetry monitor for 2.4GHz wireless peripherals"
readme = "Readme.MD"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Pratyaksh Kumar Jha" }]
dependencies = [
    "hidapi>=0.14.0; platform_system == 'Windows'",
    "pystray>=0.19.0",
    "Pillow>=9.0.0"
]

[project.scripts]
universal-24g-monitor = "cli:main"
universal-24g-monitor-tray = "tray:main"

[tool.setuptools]
py-modules = ["cli", "tray"]

[tool.setuptools.packages.find]
where = ["."]
include = ["transport*", "data*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.rules"]